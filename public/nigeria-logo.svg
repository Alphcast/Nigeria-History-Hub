<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#008751" />
      <stop offset="85%" stop-color="#00643c" />
      <stop offset="100%" stop-color="#00472a" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#greenGlow)" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Nigerian Tri-Band Flag Badge Inside -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="42" />
    </clipPath>
    <!-- Left Green Band -->
    <rect x="8" y="8" width="28" height="84" fill="#008751" />
    <!-- Center White Band -->
    <rect x="36" y="8" width="28" height="84" fill="#ffffff" />
    <!-- Right Green Band -->
    <rect x="64" y="8" width="28" height="84" fill="#008751" />
  </g>

  <!-- Central Nigeria Coat of Arms Silhouette / Emblem -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- Red Eagle on Top -->
    <path d="M50 20 L53 25 L58 24 L54 28 L56 33 L50 30 L44 33 L46 28 L42 24 L47 25 Z" fill="#dc2626" stroke="#991b1b" stroke-width="0.6"/>

    <!-- Green & White Wreath below Eagle -->
    <rect x="42" y="31" width="16" height="3" rx="1.5" fill="#008751" stroke="#ffffff" stroke-width="0.6" />

    <!-- Supporting White Horses -->
    <!-- Left Horse -->
    <path d="M34 40 C31 43 30 50 32 58 C33 60 36 62 37 60 C38 56 36 50 37 46 C37 43 36 41 34 40 Z" fill="#ffffff" stroke="#1f2937" stroke-width="0.8"/>
    <!-- Right Horse -->
    <path d="M66 40 C69 43 70 50 68 58 C67 60 64 62 63 60 C62 56 64 50 63 46 C63 43 64 41 66 40 Z" fill="#ffffff" stroke="#1f2937" stroke-width="0.8"/>

    <!-- Central Black Shield with Silver Y Pall (Niger & Benue Rivers) -->
    <path d="M43 36 L57 36 C57 48 56 58 50 64 C44 58 43 48 43 36 Z" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
    <!-- Silver Y Pall -->
    <path d="M44 38 L48 44 L48 58 L52 58 L52 44 L56 38 L53 38 L50 43 L47 38 Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.4"/>

    <!-- Red Flowers & Green Grass Base -->
    <ellipse cx="50" cy="67" rx="20" ry="3.5" fill="#15803d" />
    <circle cx="42" cy="66" r="1.5" fill="#ef4444" />
    <circle cx="50" cy="67" r="1.8" fill="#ef4444" />
    <circle cx="58" cy="66" r="1.5" fill="#ef4444" />

    <!-- National Motto Scroll -->
    <rect x="30" y="71" width="40" height="6.5" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
    <text x="50" y="76" font-family="Arial, sans-serif" font-size="3.2" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="0.2">UNITY &amp; FAITH</text>
  </g>
</svg>
